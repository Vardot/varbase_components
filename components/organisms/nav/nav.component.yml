$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Nav
status: experimental
description: Nav component description
props:
  type: object
  properties:
    items:
      type: array
      name: Items
      description: Navigation items.
    alignment:
      type: string
      name: Alignment
      enum:
        - ''
        - left
        - right
        - center
        - vertical
    style:
      type: string
      name: Style
      enum:
        - ''
        - tabs
        - pills
    fill:
      type: string
      name: Fill
      enum:
        - ''
        - fill
        - justify
    attributes:
      type: object
      title: Attributes
      description: HTML attributes for the containing element.
      $ref: 'ui-patterns://attributes'
libraryOverrides:
  dependencies:
    - varbase_components/bs-dropdown-script
