$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Nav
status: experimental
description: Nav component description
props:
  type: object
  properties:
    alignment:
      type: string
      name: Alignment
      enum:
        - ''
        - left
        - right
        - center
        - vertical
    style:
      type: string
      name: Style
      enum:
        - ''
        - tabs
        - pills
    fill:
      type: string
      name: Fill
      enum:
        - ''
        - fill
        - justify
    attributes:
      type: Drupal\Core\Template\Attribute
slots:
  items:
    name: Items
    description: Navigation items.
libraryOverrides:
  dependencies:
    - varbase_components/bs-dropdown-script
